    function compressImage(file, maxWidth = 520) {
      return new Promise((resolve) => {
        if (!file) return resolve("");
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

                            <span className="text-[#002664] font-bold">{p.role}</span>
                          </div>
                          <span className="text-slate-400">{p.time}</span>
                        </div>
                        <p className="text-xs sm:text-sm text-slate-800">{p.text}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ==================== DIGITAL CARD ==================== */}
            {activeTab === "card" && (
              <div className="max-w-md mx-auto">
                <div className="rounded-2xl overflow-hidden shadow-2xl border-2 border-[#FECB00] bg-gradient-to-br from-[#002664] via-[#001b47] to-slate-950 text-white p-6">
                  <div className="flex items-center gap-2.5 border-b border-white/15 pb-3 mb-4">
                    <GiatLogo className="w-10 h-10" />
                    <div>
                      <div className="text-xs font-extrabold text-[#FECB00]">
                        CARTE D'APPRENANT OFFICIELLE
                      </div>
                      <div className="font-extrabold text-sm">GIAT — ACADÉMIE NATIONALE IA</div>
                    </div>
                  </div>
                  <div className="flex items-center gap-4">
                    <div className="w-20 h-20 rounded-xl bg-white/10 border border-amber-300/50 overflow-hidden flex items-center justify-center shrink-0">
                      {user.selfiePhoto ? (
                        <img src={user.selfiePhoto} alt="Apprenant" className="w-full h-full object-cover" />
                      ) : (
                        <span className="text-2xl">👤</span>
                      )}
                    </div>
                    <div className="space-y-1">
                      <div className="font-extrabold text-base">{user.fullName || "Apprenant GIAT"}</div>
                      <div className="text-xs text-slate-300">{user.city}</div>
                      <div className="inline-block px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[11px] font-bold">
                        {isKycOk ? "KYC ✅" : "KYC ⏳"} • {gamification.xp} XP
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== CERTIFICATE A4 ==================== */}
            {activeTab === "cert" && (
              <div className="space-y-4">
                <div className="no-print flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border">
                  <div>
                    <h2 className="font-extrabold">Mon Attestation Officielle GIAT (A4)</h2>
                    <p className="text-xs text-slate-500">
                      {user.certNumber || "Validez les 6 modules pour générer le numéro QR"}
                    </p>
                  </div>
                  <button
                    onClick={() => window.print()}
                    disabled={!user.certNumber}
                    className="px-5 py-2.5 rounded-xl bg-[#002664] disabled:bg-slate-300 text-white font-extrabold text-xs"
                  >
                    🖨️ Imprimer / PDF A4
                  </button>
                </div>

                <div
                  id="printable-certificate"
                  className="bg-white rounded-2xl p-6 sm:p-10 shadow-xl border-8 border-double border-[#002664] max-w-4xl mx-auto text-center space-y-5"
                >
                  <div className="flex items-center justify-between text-xs font-extrabold text-[#002664] border-b-2 border-[#FECB00] pb-3">
                    <span>RÉPUBLIQUE DU TCHAD</span>
                    <div className="flex items-center gap-2">
                      <GiatLogo className="w-10 h-10" />
                      <span>GIAT TCHAD</span>
                    </div>
                    <span>POWERED BY GDB</span>
                  </div>

                  <h1 className="font-serif-cert text-2xl sm:text-4xl font-extrabold text-[#002664]">
                    ATTESTATION DE RÉUSSITE
                  </h1>

                  <div className="font-serif-cert text-2xl sm:text-3xl font-extrabold text-slate-900 underline decoration-[#FECB00] decoration-4">
                    {user.fullName || "[NOM COMPLET VÉRIFIÉ KYC]"}
                  </div>

                  <p className="text-xs sm:text-sm text-slate-700 max-w-2xl mx-auto">
                    A validé avec succès le programme officiel de <strong>18 heures</strong> en Intelligence Artificielle Appliquée, Éthique Numérique et Création de Valeur.
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 items-center pt-4 border-t text-xs">
                    <div className="text-start">
                      <div className="font-bold text-slate-500">N° ATTESTATION :</div>
                      <div className="font-extrabold text-[#002664] text-sm">
                        {user.certNumber || "GIAT-2026-EN-ATTENTE"}
                      </div>
                    </div>
                    <div className="flex justify-center">
                      <img
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(
                          user.certNumber || "GIAT-TCHAD-OFFICIEL"
                        )}`}
                        alt="QR"
                        className="w-24 h-24 border p-1 rounded-lg"
                      />
                    </div>
                    <div className="text-end">
                      <div className="font-bold">Le PDG Fondateur</div>
                      <div className="font-serif-cert italic text-base font-bold text-[#002664]">
                        Mahamat Gombo Abakar
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== DIRECTORY & QR VERIFIER ==================== */}
            {activeTab === "directory" && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 shadow-sm border space-y-3">
                  <h2 className="text-lg font-extrabold">🔍 Vérificateur d'Authenticité QR / Certificat</h2>
                  <div className="flex flex-wrap gap-2">
                    <input
                      type="text"
                      value={verifyCode}
                      onChange={(e) => setVerifyCode(e.target.value)}
                      placeholder="Ex: GIAT-2026-NDJ-0001"
                      className="px-3.5 py-2.5 rounded-xl border text-sm flex-1 min-w-[220px]"
                    />
                    <button
                      onClick={handleVerifyCert}
                      className="px-5 py-2.5 rounded-xl bg-[#002664] text-white font-bold text-sm"
                    >
                      Vérifier
                    </button>
                  </div>
                  {verifyResult && (
                    <div className="p-3.5 rounded-xl bg-emerald-50 border border-emerald-300 text-xs font-bold">
                      {verifyResult === "invalid"
                        ? "❌ Numéro introuvable dans le registre GIAT."
                        : `✅ AUTHENTIQUE : ${verifyResult.fullName} (${verifyResult.city}) — ${verifyResult.id}`}
                    </div>
                  )}
                </div>

                <div className="bg-white rounded-2xl p-6 shadow-sm border space-y-4">
                  <div className="flex flex-wrap justify-between gap-2">
                    <h2 className="text-lg font-extrabold">🇹🇩 Annuaire des Lauréats Vérifiés GIAT</h2>
                    <input
                      type="text"
                      value={dirSearch}
                      onChange={(e) => setDirSearch(e.target.value)}
                      placeholder="Ville ou nom..."
                      className="px-3.5 py-2 rounded-xl border text-xs"
                    />
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {filteredDirectory.map((l) => (
                      <div key={l.id} className="p-4 rounded-xl border flex items-center justify-between">
                        <div>
                          <div className="font-extrabold text-sm">{l.fullName}</div>
                          <div className="text-xs text-slate-600">{l.city} • {l.specialty}</div>
                          <div className="text-[11px] text-slate-400">{l.id}</div>
                        </div>
                        <span className="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[11px] font-extrabold">
                          GIAT ✅
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ==================== ADMIN PDG + TRAINER DESIGN TOOLS ==================== */}
            {activeTab === "admin" && (
              <div className="space-y-6">
                {!adminUnlocked ? (
                  <div className="max-w-md mx-auto bg-white rounded-2xl p-6 shadow-md border text-center space-y-4">
                    <GiatLogo className="w-16 h-16 mx-auto" />
                    <h2 className="text-xl font-extrabold">Accès Administrateur PDG</h2>
                    <input
                      type="password"
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value)}
                      placeholder="Code PIN (2350)"
                      className="w-full px-4 py-3 rounded-xl border text-center font-bold tracking-widest"
                    />
                    {pinError && <div className="text-xs text-red-600 font-bold">{pinError}</div>}
                    <button
                      onClick={() => {
                        if (pinInput.trim() === (sbConfig.adminPin || "2350")) {
                          setAdminUnlocked(true);
                          setPinError("");
                        } else {
                          setPinError("PIN incorrect");
                        }
                      }}
                      className="w-full py-3 rounded-xl bg-[#002664] text-white font-extrabold text-sm"
                    >
                      Déverrouiller
                    </button>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-slate-900 text-white rounded-2xl p-5 flex flex-wrap items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <GiatLogo className="w-12 h-12" />
                        <div>
                          <div className="text-xs text-[#FECB00] font-extrabold">DIRECTION GÉNÉRALE</div>
                          <h2 className="text-xl font-extrabold">Tableau de Bord Admin & Formateurs</h2>
                        </div>
                      </div>
                      <div className="flex gap-2">
                        <button
                          onClick={() => setShowSbModal(true)}
                          className="px-3.5 py-2 rounded-xl bg-[#FECB00] text-[#002664] text-xs font-extrabold"
                        >
                          ⚙️ Supabase
                        </button>
                        <button
                          onClick={() => fetchAllFromSupabase(false)}
                          className="px-3.5 py-2 rounded-xl bg-white/15 text-xs font-bold"
                        >
                          🔄 Sync
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                      {/* Publish Announcement */}
                      <form onSubmit={handlePublishAnnouncement} className="bg-white rounded-2xl p-5 border space-y-3">
                        <h3 className="font-extrabold text-sm text-[#002664] uppercase">
                          📢 Publier une Annonce Officielle
                        </h3>
                        <select
                          value={newAnnCat}
                          onChange={(e) => setNewAnnCat(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border text-xs font-bold"
                        >
                          <option>Général</option>
                          <option>Présentiel N'Djamena</option>
                          <option>Opportunités IA</option>
                        </select>
                        <input
                          type="text"
                          value={newAnnTitle}
                          onChange={(e) => setNewAnnTitle(e.target.value)}
                          placeholder="Titre de l'annonce..."
                          className="w-full px-3 py-2 rounded-xl border text-xs"
                        />
                        <textarea
                          rows="2"
                          value={newAnnBody}
                          onChange={(e) => setNewAnnBody(e.target.value)}
                          placeholder="Contenu de l'annonce..."
                          className="w-full px-3 py-2 rounded-xl border text-xs"
                        />
                        <button
                          type="submit"
                          className="px-4 py-2 rounded-xl bg-[#002664] text-white font-extrabold text-xs"
                        >
                          Publier l'annonce
                        </button>
                      </form>

                      {/* Trainer Course Design Tool */}
                      <form onSubmit={handleAddCustomModule} className="bg-white rounded-2xl p-5 border space-y-3">
                        <h3 className="font-extrabold text-sm text-[#002664] uppercase">
                          🎓 Outil Formateur : Ajouter un Nouveau Module de Cours
                        </h3>
                        <input
                          type="text"
                          value={trainerModTitle}
                          onChange={(e) => setTrainerModTitle(e.target.value)}
                          placeholder="Titre du module (ex: IA pour l'Agriculture au Tchad)"
                          className="w-full px-3 py-2 rounded-xl border text-xs"
                        />
                        <textarea
                          rows="3"
                          value={trainerModDesc}
                          onChange={(e) => setTrainerModDesc(e.target.value)}
                          placeholder="Contenu pédagogique et résumé vocal du module..."
                          className="w-full px-3 py-2 rounded-xl border text-xs"
                        />
                        <button
                          type="submit"
                          className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-extrabold text-xs"
                        >
                          + Ajouter au programme
                        </button>
                      </form>
                    </div>

                    {/* Candidates Validation Table */}
                    <div className="bg-white rounded-2xl border overflow-x-auto">
                      <table className="w-full text-start border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-50 border-b text-slate-600 uppercase">
                            <th className="p-3.5">Apprenant</th>
                            <th className="p-3.5">Ville / Option</th>
                            <th className="p-3.5">KYC</th>
                            <th className="p-3.5">Paiement / Tx</th>
                            <th className="p-3.5">Actions</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y">
                          {allCandidates.map((c) => (
                            <tr key={c.id}>
                              <td className="p-3.5 font-bold">{c.fullName} ({c.phone})</td>
                              <td className="p-3.5">{c.city} • {c.mode}</td>
                              <td className="p-3.5">{c.kycStatus}</td>
                              <td className="p-3.5">{c.paymentStatus} ({c.txId || "—"})</td>
                              <td className="p-3.5 flex gap-1.5">
                                <button
                                  onClick={() => setInspectedCandidate(c)}
                                  className="px-2.5 py-1 rounded bg-slate-800 text-white font-bold"
                                >
                                  Inspecter
                                </button>
                                {c.kycStatus !== "verified" && (
                                  <button
                                    onClick={() => adminUpdateCandidate(c.id, { kycStatus: "verified" })}
                                    className="px-2.5 py-1 rounded bg-emerald-600 text-white font-bold"
                                  >
                                    KYC ✅
                                  </button>
                                )}
                                {c.paymentStatus !== "paid" && (
                                  <button
                                    onClick={() => adminUpdateCandidate(c.id, { paymentStatus: "paid" })}
                                    className="px-2.5 py-1 rounded bg-blue-600 text-white font-bold"
                                  >
                                    5000F ✅
                                  </button>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Inspect Candidate Modal */}
          {inspectedCandidate && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-3xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between border-b pb-3">
                  <h3 className="font-extrabold">{inspectedCandidate.fullName}</h3>
                  <button onClick={() => setInspectedCandidate(null)}>✕</button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                  <div>
                    <div className="font-bold mb-1">RECTO</div>
                    {inspectedCandidate.idPhotoFront && (
                      <img src={inspectedCandidate.idPhotoFront} alt="Recto" className="w-full h-40 object-contain border rounded-xl" />
                    )}
                  </div>
                  <div>
                    <div className="font-bold mb-1">VERSO</div>
                    {inspectedCandidate.idPhotoBack && (
                      <img src={inspectedCandidate.idPhotoBack} alt="Verso" className="w-full h-40 object-contain border rounded-xl" />
                    )}
                  </div>
                  <div>
                    <div className="font-bold mb-1">Selfie</div>
                    {inspectedCandidate.selfiePhoto && (
                      <img src={inspectedCandidate.selfiePhoto} alt="Selfie" className="w-full h-40 object-contain border rounded-xl" />
                    )}
                  </div>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => adminUpdateCandidate(inspectedCandidate.id, { kycStatus: "verified" })}
                    className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold"
                  >
                    Approuver KYC ✅
                  </button>
                  <button
                    onClick={() => adminUpdateCandidate(inspectedCandidate.id, { paymentStatus: "paid" })}
                    className="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-extrabold"
                  >
                    Valider 5000 FCFA 💰
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Supabase Config Modal */}
          {showSbModal && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between border-b pb-3">
                  <h3 className="font-extrabold">Configuration Supabase</h3>
                  <button onClick={() => setShowSbModal(false)}>✕</button>
                </div>
                <div className="space-y-3 text-xs">
                  <input
                    type="text"
                    value={sbConfig.url}
                    onChange={(e) => setSbConfig({ ...sbConfig, url: e.target.value })}
                    placeholder="Project URL (https://xxxx.supabase.co)"
                    className="w-full px-3 py-2 rounded-xl border"
                  />
                  <input
                    type="text"
                    value={sbConfig.anonKey}
                    onChange={(e) => setSbConfig({ ...sbConfig, anonKey: e.target.value })}
                    placeholder="Anon / Publishable Key"
                    className="w-full px-3 py-2 rounded-xl border"
                  />
                  <input
                    type="text"
                    value={sbConfig.adminPin}
                    onChange={(e) => setSbConfig({ ...sbConfig, adminPin: e.target.value })}
                    placeholder="PIN Admin (2350)"
                    className="w-full px-3 py-2 rounded-xl border"
                  />
                  {sbError && <div className="text-red-600 font-bold">{sbError}</div>}
                  <div className="flex gap-2">
                    <button
                      onClick={async () => {
                        await fetchAllFromSupabase(false);
                        setShowSbModal(false);
                      }}
                      className="px-4 py-2 rounded-xl bg-[#002664] text-white font-extrabold"
                    >
                      Connecter
                    </button>
                    <button
                      onClick={() => {
                        navigator.clipboard?.writeText(SQL_SNIPPET);
                        notify("SQL copié ✅");
                      }}
                      className="px-4 py-2 rounded-xl bg-amber-100 text-amber-900 font-extrabold"
                    >
                      Copier SQL
                    </button>
                  </div>
                  <pre className="p-3 rounded-xl bg-slate-900 text-emerald-300 text-[11px] overflow-x-auto">
                    {SQL_SNIPPET}
                  </pre>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="no-print bg-slate-900 text-slate-400 text-xs py-6 px-4 mt-10">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <GiatLogo className="w-8 h-8" />
                <span>
                  <strong className="text-white">GIAT — Gombo Intelligence Artificielle Tchad</strong> • PDG Mahamat Gombo Abakar
                </span>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={() => setActiveTab("announcements")} className="text-amber-400 hover:underline font-bold">
                  📢 Annonces
                </button>
                <span>•</span>
                <button onClick={() => setShowSbModal(true)} className="hover:underline font-bold">
                  Supabase
                </button>
                <span>•</span>
                <button onClick={() => setActiveTab("admin")} className="text-white hover:underline font-bold">
                  🔐 Admin PDG
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
