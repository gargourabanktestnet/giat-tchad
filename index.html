    function compressImage(file, maxWidth = 520) {
      return new Promise((resolve) => {
        if (!file) return resolve("");
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

                    <span>PDG Mahamat Gombo Abakar</span>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== CERTIFICATE A4 ==================== */}
            {activeTab === "cert" && (
              <div className="space-y-4">
                <div className="no-print flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200">
                  <div>
                    <h2 className="font-extrabold text-slate-900">{t.certHeader}</h2>
                    <p className="text-xs text-slate-500">
                      {user.certNumber ? user.certNumber : "6/6 Modules requis"}
                    </p>
                  </div>
                  <button
                    onClick={() => window.print()}
                    disabled={!user.certNumber}
                    className="px-5 py-2.5 rounded-xl bg-[#002664] hover:bg-blue-900 disabled:bg-slate-300 text-white font-extrabold text-xs shadow"
                  >
                    🖨️ {t.certPrintBtn}
                  </button>
                </div>

                <div
                  id="printable-certificate"
                  className="bg-white rounded-2xl p-6 sm:p-10 shadow-xl border-8 border-double border-[#002664] max-w-4xl mx-auto text-center space-y-5"
                >
                  <div className="flex items-center justify-between text-xs font-extrabold text-[#002664] border-b-2 border-[#FECB00] pb-3">
                    <span>{t.certCountry}</span>
                    <div className="flex items-center gap-2">
                      <GiatLogo className="w-10 h-10" />
                      <span>GIAT TCHAD</span>
                    </div>
                    <span>POWERED BY GDB</span>
                  </div>

                  <div className="pt-2">
                    <div className="text-xs uppercase tracking-[0.2em] text-amber-700 font-extrabold">
                      {t.certAcademy}
                    </div>
                    <h1 className="font-serif-cert text-2xl sm:text-4xl font-extrabold text-[#002664] mt-1">
                      {t.certMainTitle}
                    </h1>
                  </div>

                  <div className="flex flex-col sm:flex-row items-center justify-center gap-4 py-2">
                    {user.selfiePhoto && (
                      <img
                        src={user.selfiePhoto}
                        alt="Photo KYC"
                        className="w-20 h-20 rounded-xl object-cover border-2 border-[#002664]"
                      />
                    )}
                    <div>
                      <div className="font-serif-cert text-2xl sm:text-3xl font-extrabold text-slate-900 underline decoration-[#FECB00] decoration-4">
                        {user.fullName || "[NOM COMPLET VÉRIFIÉ KYC]"}
                      </div>
                      <div className="text-xs text-slate-600 mt-1">
                        {user.city} • {user.mode === "presential" ? "Présentiel N'Djamena" : "100% En Ligne"}
                      </div>
                    </div>
                  </div>

                  <p className="text-xs sm:text-sm text-slate-700 max-w-2xl mx-auto leading-relaxed">
                    A validé avec succès le programme officiel de <strong>18 heures (6 Modules)</strong> en Intelligence Artificielle Appliquée, Éthique Numérique et Création de Valeur.
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 items-center pt-4 border-t border-slate-200 text-xs">
                    <div className="text-start space-y-1">
                      <div className="font-bold text-slate-500">N° ATTESTATION :</div>
                      <div className="font-extrabold text-[#002664] text-sm">
                        {user.certNumber || "GIAT-2026-EN-ATTENTE"}
                      </div>
                      <div className="text-slate-500">{user.certifiedAt || "—"}</div>
                    </div>

                    <div className="flex flex-col items-center">
                      <img
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(
                          user.certNumber || "GIAT-TCHAD-OFFICIEL"
                        )}`}
                        alt="QR Code"
                        className="w-24 h-24 border p-1 rounded-lg"
                      />
                    </div>

                    <div className="text-end space-y-1">
                      <div className="font-bold text-slate-700">PDG Fondateur</div>
                      <div className="font-serif-cert italic text-base font-bold text-[#002664]">
                        Mahamat Gombo Abakar
                      </div>
                      <div className="inline-block px-2.5 py-0.5 rounded-full border-2 border-[#C60C30] text-[#C60C30] font-extrabold text-[10px] uppercase">
                        Cachet Officiel GIAT
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== DIRECTORY & QR VERIFIER ==================== */}
            {activeTab === "directory" && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                  <h2 className="text-lg font-extrabold text-slate-900 mb-1">🔍 {t.verifyTitle}</h2>
                  <p className="text-xs text-slate-500 mb-4">{t.verifyDesc}</p>
                  <div className="flex flex-wrap gap-2">
                    <input
                      type="text"
                      value={verifyCode}
                      onChange={(e) => setVerifyCode(e.target.value)}
                      placeholder="GIAT-2026-NDJ-0001"
                      className="px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm flex-1 min-w-[220px]"
                    />
                    <button
                      onClick={handleVerifyCert}
                      className="px-5 py-2.5 rounded-xl bg-[#002664] text-white font-bold text-sm"
                    >
                      {t.verifyBtn}
                    </button>
                  </div>

                  {verifyResult && (
                    <div className="mt-4">
                      {verifyResult === "invalid" ? (
                        <div className="p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-800 text-xs font-bold">
                          ❌ Numéro introuvable / Invalid certificate ID.
                        </div>
                      ) : (
                        <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-950 text-xs space-y-1">
                          <div className="font-extrabold text-sm text-emerald-800">
                            ✅ ATTESTATION OFFICIELLE AUTHENTIQUE
                          </div>
                          <div>
                            <strong>{verifyResult.fullName}</strong> ({verifyResult.city}) —{" "}
                            <strong>{verifyResult.id}</strong>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <h2 className="text-lg font-extrabold text-slate-900">🇹🇩 {t.dirTitle}</h2>
                      <p className="text-xs text-slate-500">{t.dirDesc}</p>
                    </div>
                    <input
                      type="text"
                      value={dirSearch}
                      onChange={(e) => setDirSearch(e.target.value)}
                      placeholder="N'Djamena, Moundou, Abéché..."
                      className="px-3.5 py-2 rounded-xl border border-slate-300 text-xs w-full sm:w-64"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {filteredDirectory.map((l) => (
                      <div
                        key={l.id}
                        className="p-4 rounded-xl border border-slate-200 flex items-start justify-between gap-3"
                      >
                        <div>
                          <div className="font-extrabold text-sm text-slate-900">{l.fullName}</div>
                          <div className="text-xs text-slate-600">
                            📍 {l.city} • {l.specialty}
                          </div>
                          <div className="text-[11px] text-slate-400 mt-1">
                            {l.id} ({l.mode})
                          </div>
                        </div>
                        <span className="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[11px] font-extrabold whitespace-nowrap">
                          GIAT ✅
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ==================== ADMIN PDG DASHBOARD ==================== */}
            {activeTab === "admin" && (
              <div className="space-y-6">
                {!adminUnlocked ? (
                  <div className="max-w-md mx-auto bg-white rounded-2xl p-6 shadow-md border border-slate-200 text-center space-y-4">
                    <GiatLogo className="w-16 h-16 mx-auto" />
                    <h2 className="text-xl font-extrabold text-slate-900">{t.adminTitle}</h2>
                    <input
                      type="password"
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value)}
                      placeholder="PIN (2350)"
                      className="w-full px-4 py-3 rounded-xl border border-slate-300 text-center font-bold tracking-widest text-base"
                    />
                    {pinError && <div className="text-xs text-red-600 font-bold">{pinError}</div>}
                    <button
                      onClick={() => {
                        if (pinInput.trim() === (sbConfig.adminPin || "2350")) {
                          setAdminUnlocked(true);
                          setPinError("");
                        } else {
                          setPinError("PIN incorrect");
                        }
                      }}
                      className="w-full py-3 rounded-xl bg-[#002664] hover:bg-blue-900 text-white font-extrabold text-sm"
                    >
                      {t.adminUnlockBtn}
                    </button>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-slate-900 text-white rounded-2xl p-5 flex flex-wrap items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <GiatLogo className="w-12 h-12" />
                        <div>
                          <div className="text-xs text-[#FECB00] font-extrabold uppercase">
                            GIAT DIRECTION GÉNÉRALE
                          </div>
                          <h2 className="text-xl font-extrabold">{t.adminBtn}</h2>
                        </div>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        <button
                          onClick={() => setShowSbModal(true)}
                          className="px-3.5 py-2 rounded-xl bg-[#FECB00] text-[#002664] text-xs font-extrabold"
                        >
                          ⚙️ Supabase
                        </button>
                        <button
                          onClick={() => fetchAllFromSupabase(false)}
                          disabled={!supabaseClient || sbSyncing}
                          className="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 disabled:opacity-40 text-white text-xs font-bold"
                        >
                          🔄 Sync
                        </button>
                      </div>
                    </div>

                    {/* Publish Official Announcement Form */}
                    <form
                      onSubmit={handlePublishAnnouncement}
                      className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-3"
                    >
                      <div className="flex items-center justify-between">
                        <h3 className="font-extrabold text-sm text-[#002664] uppercase">
                          📢 Publier une Annonce Officielle à la Communauté GIAT
                        </h3>
                        <select
                          value={newAnnCat}
                          onChange={(e) => setNewAnnCat(e.target.value)}
                          className="px-3 py-1.5 rounded-lg border text-xs font-bold bg-slate-50"
                        >
                          <option>Général</option>
                          <option>Présentiel N'Djamena</option>
                          <option>Opportunités IA</option>
                        </select>
                      </div>
                      <input
                        type="text"
                        value={newAnnTitle}
                        onChange={(e) => setNewAnnTitle(e.target.value)}
                        placeholder="Titre de l'annonce officielle..."
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs"
                      />
                      <textarea
                        rows="2"
                        value={newAnnBody}
                        onChange={(e) => setNewAnnBody(e.target.value)}
                        placeholder="Message destiné aux apprenants et à la communauté GIAT TCHAD..."
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs"
                      />
                      <button
                        type="submit"
                        className="px-4 py-2 rounded-xl bg-[#002664] hover:bg-blue-900 text-white font-extrabold text-xs"
                      >
                        Publier l'annonce & notifier
                      </button>
                    </form>

                    {/* KPI Cards */}
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                      {[
                        { label: "Total", val: stats.total, color: "text-slate-900" },
                        { label: "KYC ⏳", val: stats.kycPending, color: "text-amber-600" },
                        { label: "Pay ⏳", val: stats.payPending, color: "text-blue-600" },
                        { label: "FCFA ✅", val: `${stats.revenue.toLocaleString()} F`, color: "text-emerald-600" },
                        { label: "Certifiés", val: stats.certifiedCount, color: "text-purple-700" },
                        { label: "N'Djamena", val: `${stats.seatsLeft}/30`, color: "text-rose-600" }
                      ].map((k) => (
                        <div key={k.label} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                          <div className="text-[11px] font-bold text-slate-500">{k.label}</div>
                          <div className={`text-lg font-extrabold mt-1 ${k.color}`}>{k.val}</div>
                        </div>
                      ))}
                    </div>

                    {/* Candidates Table */}
                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
                      <table className="w-full text-start border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 uppercase">
                            <th className="p-3.5">Apprenant</th>
                            <th className="p-3.5">Ville / Option</th>
                            <th className="p-3.5">KYC</th>
                            <th className="p-3.5">Paiement / Tx</th>
                            <th className="p-3.5">Actions</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {allCandidates.map((c) => (
                            <tr key={c.id} className="hover:bg-slate-50">
                              <td className="p-3.5">
                                <div className="font-extrabold text-slate-900">{c.fullName}</div>
                                <div className="text-slate-500">
                                  {c.phone} • {c.email}
                                </div>
                              </td>
                              <td className="p-3.5">
                                <div className="font-bold">{c.city}</div>
                                <div className="text-slate-500">{c.mode}</div>
                              </td>
                              <td className="p-3.5 font-bold">{c.kycStatus}</td>
                              <td className="p-3.5">
                                <div className="font-bold">{c.paymentStatus}</div>
                                <div className="font-mono text-slate-500">{c.txId || "—"}</div>
                              </td>
                              <td className="p-3.5">
                                <div className="flex flex-wrap gap-1.5">
                                  <button
                                    onClick={() => setInspectedCandidate(c)}
                                    className="px-2.5 py-1 rounded bg-slate-800 text-white font-bold"
                                  >
                                    Inspecter
                                  </button>
                                  {c.kycStatus !== "verified" && (
                                    <button
                                      onClick={() => adminUpdateCandidate(c.id, { kycStatus: "verified" })}
                                      className="px-2.5 py-1 rounded bg-emerald-600 text-white font-bold"
                                    >
                                      KYC ✅
                                    </button>
                                  )}
                                  {c.paymentStatus !== "paid" && (
                                    <button
                                      onClick={() => adminUpdateCandidate(c.id, { paymentStatus: "paid" })}
                                      className="px-2.5 py-1 rounded bg-blue-600 text-white font-bold"
                                    >
                                      5000F ✅
                                    </button>
                                  )}
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Inspect Candidate Modal (Recto + Verso + Selfie) */}
          {inspectedCandidate && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-3xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">
                    {inspectedCandidate.fullName} — ({inspectedCandidate.idType})
                  </h3>
                  <button
                    onClick={() => setInspectedCandidate(null)}
                    className="text-slate-500 font-bold text-sm"
                  >
                    ✕
                  </button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                  <div>
                    <div className="font-bold mb-1">Pièce — RECTO</div>
                    {inspectedCandidate.idPhotoFront ? (
                      <img src={inspectedCandidate.idPhotoFront} alt="Recto" className="w-full h-44 object-contain border rounded-xl" />
                    ) : (
                      <div className="h-32 border rounded-xl flex items-center justify-center text-slate-400">
                        Recto absent
                      </div>
                    )}
                  </div>
                  <div>
                    <div className="font-bold mb-1">Pièce — VERSO</div>
                    {inspectedCandidate.idPhotoBack ? (
                      <img src={inspectedCandidate.idPhotoBack} alt="Verso" className="w-full h-44 object-contain border rounded-xl" />
                    ) : (
                      <div className="h-32 border rounded-xl flex items-center justify-center text-slate-400">
                        Verso absent
                      </div>
                    )}
                  </div>
                  <div>
                    <div className="font-bold mb-1">Selfie Liveness</div>
                    {inspectedCandidate.selfiePhoto ? (
                      <img src={inspectedCandidate.selfiePhoto} alt="Selfie" className="w-full h-44 object-contain border rounded-xl" />
                    ) : (
                      <div className="h-32 border rounded-xl flex items-center justify-center text-slate-400">
                        Selfie absent
                      </div>
                    )}
                  </div>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button
                    onClick={() => adminUpdateCandidate(inspectedCandidate.id, { kycStatus: "verified" })}
                    className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold"
                  >
                    Approuver KYC ✅
                  </button>
                  <button
                    onClick={() => adminUpdateCandidate(inspectedCandidate.id, { paymentStatus: "paid" })}
                    className="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-extrabold"
                  >
                    Valider 5000 FCFA 💰
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Supabase Config Modal */}
          {showSbModal && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">Supabase Configuration</h3>
                  <button onClick={() => setShowSbModal(false)} className="text-slate-500 font-bold">
                    ✕
                  </button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold mb-1">Project URL</label>
                    <input
                      type="text"
                      value={sbConfig.url}
                      onChange={(e) => setSbConfig({ ...sbConfig, url: e.target.value })}
                      placeholder="https://xxxx.supabase.co"
                      className="w-full px-3 py-2 rounded-xl border"
                    />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Anon / Publishable Key</label>
                    <input
                      type="text"
                      value={sbConfig.anonKey}
                      onChange={(e) => setSbConfig({ ...sbConfig, anonKey: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border"
                    />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Admin PIN</label>
                    <input
                      type="text"
                      value={sbConfig.adminPin}
                      onChange={(e) => setSbConfig({ ...sbConfig, adminPin: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border"
                    />
                  </div>
                  {sbError && <div className="p-2 rounded bg-red-50 text-red-700 font-bold">{sbError}</div>}
                  <div className="flex gap-2">
                    <button
                      onClick={async () => {
                        await fetchAllFromSupabase(false);
                        setShowSbModal(false);
                      }}
                      className="px-4 py-2.5 rounded-xl bg-[#002664] text-white font-extrabold"
                    >
                      Connecter
                    </button>
                    <button
                      onClick={() => {
                        navigator.clipboard?.writeText(SQL_SNIPPET);
                        notify("SQL copié ✅");
                      }}
                      className="px-4 py-2.5 rounded-xl bg-amber-100 text-amber-900 font-extrabold"
                    >
                      Copier SQL
                    </button>
                  </div>
                  <pre className="p-3 rounded-xl bg-slate-900 text-emerald-300 text-[11px] overflow-x-auto">
                    {SQL_SNIPPET}
                  </pre>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="no-print bg-slate-900 text-slate-400 text-xs py-6 px-4 mt-10">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <GiatLogo className="w-8 h-8" />
                <span>
                  <strong className="text-white">GIAT — Gombo Intelligence Artificielle Tchad</strong> • PDG Mahamat Gombo Abakar
                </span>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={() => setActiveTab("announcements")} className="text-amber-400 hover:underline font-bold">
                  📢 {t.navAnn}
                </button>
                <span>•</span>
                <button onClick={() => setShowSbModal(true)} className="text-slate-300 hover:underline font-bold">
                  Supabase
                </button>
                <span>•</span>
                <button onClick={() => setActiveTab("admin")} className="text-white hover:underline font-bold">
                  🔐 {t.adminBtn}
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
