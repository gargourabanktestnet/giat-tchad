    function compressImage(file, maxWidth = 520) {
      return new Promise((resolve) => {
        if (!file) return resolve("");
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

        }
        if (voiceState === "paused") {
          window.speechSynthesis.resume();
          setVoiceState("playing");
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(textToSpeak);
        utter.lang = lang === "ar" ? "ar-SA" : lang === "en" ? "en-US" : "fr-FR";
        utter.onend = () => setVoiceState("idle");

        setVoiceState("playing");

                          <span className="text-base font-extrabold">{isDone ? "✅" : "☐"}</span>
                        </button>
                      );
                    })}
                  </div>

                  {(() => {
                    const mod = allModules.find((m) => m.id === selectedModule) || allModules[0];
                    const isDone = (user.completedModules || []).includes(mod.id);
                    const locked = !isKycOk || !isPaidOk;
                    const titleText = mod.title[lang] || mod.title.fr;
                    const lessonText = mod.lesson[lang] || mod.lesson.fr;
                    const qObj = mod.quiz[lang] || mod.quiz.fr;

                    return (
                      <div className="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border space-y-5">
                        <div className="flex items-center justify-between gap-2">
                          <div>
                            <span className="text-xs font-extrabold text-[#002664]">{mod.day}</span>
                            <h3 className="text-xl font-extrabold text-slate-900">{titleText}</h3>
                          </div>
                          {isDone && (
                            <span className="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold">
                              ✅ Validé
                            </span>
                          )}
                        </div>

                        {/* Audio Controls */}
                        <div className="flex flex-wrap gap-2 p-3.5 rounded-xl bg-slate-900 text-white">
                          <button
                            type="button"
                            onClick={() => toggleAudio(`${titleText}. ${lessonText}`)}
                            className="px-4 py-2 rounded-lg bg-[#FECB00] text-[#002664] font-extrabold text-xs"
                          >
                            {voiceState === "playing"
                              ? `⏸️ ${t.pauseAudio}`
                              : voiceState === "paused"
                              ? `▶️ ${t.resumeAudio}`
                              : `🔊 ${t.listenAudio}`}
                          </button>
                          {voiceState !== "idle" && (
                            <button
                              type="button"
                              onClick={stopAudio}
                              className="px-3 py-2 rounded-lg bg-white/15 text-xs font-bold"
                            >
                              ⏹️ {t.stopAudio}
                            </button>
                          )}
                        </div>

                        <p className="text-sm text-slate-800 leading-relaxed bg-slate-50 p-4 rounded-xl border">
                          {lessonText}
                        </p>

                        <div className="pt-3 border-t space-y-3">
                          <div className="font-bold text-sm">{qObj.q}</div>
                          <div className="space-y-2">
                            {qObj.opts.map((opt, i) => (
                              <label
                                key={i}
                                className={`flex items-center gap-2.5 p-3 rounded-xl border text-xs sm:text-sm cursor-pointer ${
                                  quizChoice === i ? "border-[#002664] bg-blue-50 font-semibold" : "border-slate-200"
                                }`}
                              >
                                <input
                                  type="radio"
                                  name={`mod_q_${mod.id}`}
                                  checked={quizChoice === i}
                                  onChange={() => setQuizChoice(i)}
                                />
                                <span>{opt}</span>
                              </label>
                            ))}
                          </div>
                          <button
                            type="button"
                            disabled={locked || quizChoice === null}
                            onClick={() => handleValidateModule(mod.id)}
                            className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-extrabold text-xs sm:text-sm"
                          >
                            {locked ? t.unlockFirst : `${t.validateMod} →`}
                          </button>
                        </div>
                      </div>
                    );
                  })()}
                </div>
              </div>
            )}

            {/* ==================== PROFESSIONAL CARD (WITH BIRTH DATE & PLACE) ==================== */}
            {activeTab === "card" && (
              <div className="max-w-md mx-auto">
                <div className="rounded-2xl overflow-hidden shadow-2xl border-2 border-[#FECB00] bg-gradient-to-br from-[#002664] via-[#001b47] to-slate-950 text-white p-6 space-y-4">
                  <div className="flex items-center gap-2.5 border-b border-white/15 pb-3">
                    <GiatLogo className="w-10 h-10" />
                    <div>
                      <div className="text-xs font-extrabold text-[#FECB00]">{t.cardHeader}</div>
                      <div className="font-extrabold text-sm">GIAT — TCHAD & DIASPORA</div>
                    </div>
                  </div>

                  <div className="flex items-center gap-4">
                    <div className="w-20 h-20 rounded-xl bg-white/10 border border-amber-300/50 overflow-hidden flex items-center justify-center shrink-0">
                      {user.selfiePhoto ? (
                        <img src={user.selfiePhoto} alt="Photo" className="w-full h-full object-cover" />
                      ) : (
                        <span className="text-2xl">👤</span>
                      )}
                    </div>
                    <div className="space-y-1 text-xs">
                      <div className="font-extrabold text-base">{user.fullName || "Apprenant GIAT"}</div>
                      <div className="text-amber-200">
                        {t.bornLabel} : <strong>{user.birthDate || "—"}</strong> {t.atLabel}{" "}
                        <strong>{user.birthPlace || "—"}</strong>
                      </div>
                      <div className="text-slate-300">
                        {t.regionLabel} : <strong>{user.region}</strong> • {audienceLabel}
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-white/15 flex items-center justify-between text-[11px] text-slate-300">
                    <span>ID : {user.certNumber || user.id || "GIAT-2026"}</span>
                    <span>PDG Mahamat Gombo Abakar</span>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== CERTIFICATE A4 (WITH BIRTH DATE, PLACE & SEAL) ==================== */}
            {activeTab === "cert" && (
              <div className="space-y-4">
                <div className="no-print flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border">
                  <div>
                    <h2 className="font-extrabold">{t.certHeader}</h2>
                    <p className="text-xs text-slate-500">
                      {user.certNumber || "Validez les 10 modules pour générer l'attestation"}
                    </p>
                  </div>
                  <button
                    onClick={() => window.print()}
                    disabled={!user.certNumber}
                    className="px-5 py-2.5 rounded-xl bg-[#002664] disabled:bg-slate-300 text-white font-extrabold text-xs"
                  >
                    🖨️ {t.printBtn}
                  </button>
                </div>

                <div
                  id="printable-certificate"
                  className="bg-white rounded-2xl p-6 sm:p-10 shadow-xl border-8 border-double border-[#002664] max-w-4xl mx-auto text-center space-y-6"
                >
                  <div className="flex flex-wrap items-center justify-between gap-2 text-xs font-extrabold text-[#002664] border-b-2 border-[#FECB00] pb-3">
                    <span>{t.certCountry}</span>
                    <div className="flex items-center gap-2">
                      <GiatLogo className="w-10 h-10" />
                      <span>GIAT TCHAD</span>
                    </div>
                    <span>{user.region}</span>
                  </div>

                  <div>
                    <div className="text-xs uppercase tracking-[0.2em] text-amber-700 font-extrabold">
                      {t.certAcademy}
                    </div>
                    <h1 className="font-serif-cert text-2xl sm:text-4xl font-extrabold text-[#002664] mt-1">
                      {t.certTitle}
                    </h1>
                  </div>

                  <p className="text-xs sm:text-sm text-slate-700 max-w-3xl mx-auto leading-relaxed">
                    {t.certBodyPrefix}{" "}
                    <strong className="font-serif-cert text-xl sm:text-2xl text-slate-900 underline decoration-[#FECB00]">
                      {user.fullName || "[NOM COMPLET]"}
                    </strong>
                    , {t.certBodyMid} <strong>{user.birthDate || "[DATE DE NAISSANCE]"}</strong>{" "}
                    {t.certBodyPlace} <strong>{user.birthPlace || "[LIEU DE NAISSANCE]"}</strong>,{" "}
                    {t.certBodyEnd}
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 items-center pt-5 border-t text-xs">
                    <div className="text-start space-y-1">
                      <div className="font-bold text-slate-500">{t.certNo} :</div>
                      <div className="font-extrabold text-[#002664] text-sm">
                        {user.certNumber || "GIAT-2026-EN-ATTENTE"}
                      </div>
                      <div className="text-slate-500">{user.certifiedAt || "—"}</div>
                    </div>

                    <div className="flex flex-col items-center">
                      <img
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(
                          user.certNumber || "GIAT-TCHAD-OFFICIEL"
                        )}`}
                        alt="QR Code"
                        className="w-24 h-24 border p-1 rounded-lg"
                      />
                    </div>

                    <div className="flex flex-col items-center justify-center min-h-[112px]">
                      {user.certNumber ? (
                        <img
                          src="./cachet-giat.png"
                          alt="Cachet Officiel GIAT"
                          onError={(e) => {
                            e.currentTarget.onerror = null;
                            e.currentTarget.src = FALLBACK_LOGO_SVG;
                          }}
                          className="w-28 h-28 object-contain -rotate-6 opacity-95"
                        />
                      ) : (
                        <div className="px-3 py-2 rounded-xl border border-dashed text-[11px] text-slate-400">
                          Cachet débloqué à la fin des modules
                        </div>
                      )}
                    </div>

                    <div className="text-end space-y-1">
                      <div className="font-bold text-slate-700">{t.ceoTitle}</div>
                      <div className="font-serif-cert italic text-base font-bold text-[#002664]">
                        Mahamat Gombo Abakar
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== DIRECTORY & QR ==================== */}
            {activeTab === "directory" && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 shadow-sm border space-y-3">
                  <h2 className="text-lg font-extrabold">🔍 QR / Certificat</h2>
                  <div className="flex flex-wrap gap-2">
                    <input
                      type="text"
                      value={verifyCode}
                      onChange={(e) => setVerifyCode(e.target.value)}
                      placeholder="GIAT-2026-NDJ-0001"
                      className="px-3.5 py-2.5 rounded-xl border text-sm flex-1 min-w-[220px]"
                    />
                    <button
                      onClick={handleVerifyCert}
                      className="px-5 py-2.5 rounded-xl bg-[#002664] text-white font-bold text-sm"
                    >
                      OK
                    </button>
                  </div>
                  {verifyResult && (
                    <div className="p-3.5 rounded-xl bg-emerald-50 border border-emerald-300 text-xs font-bold">
                      {verifyResult === "invalid"
                        ? "❌ Introuvable"
                        : `✅ ${verifyResult.fullName} (${verifyResult.region}) — ${verifyResult.id}`}
                    </div>
                  )}
                </div>

                <div className="bg-white rounded-2xl p-6 shadow-sm border space-y-4">
                  <div className="flex flex-wrap justify-between gap-2">
                    <h2 className="text-lg font-extrabold">🇹🇩 {t.navDir}</h2>
                    <input
                      type="text"
                      value={dirSearch}
                      onChange={(e) => setDirSearch(e.target.value)}
                      placeholder="Province / Diaspora / Nom..."
                      className="px-3.5 py-2 rounded-xl border text-xs"
                    />
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {filteredLaureates.map((l) => (
                      <div key={l.id} className="p-4 rounded-xl border flex items-center justify-between">
                        <div>
                          <div className="font-extrabold text-sm">{l.fullName}</div>
                          <div className="text-xs text-slate-600">{l.region} • {l.audience}</div>
                          <div className="text-[11px] text-slate-400">{l.id}</div>
                        </div>
                        <span className="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[11px] font-extrabold">
                          GIAT ✅
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ==================== ADMIN & MODULE BUILDER ==================== */}
            {activeTab === "admin" && (
              <div className="space-y-6">
                {!adminUnlocked ? (
                  <div className="max-w-md mx-auto bg-white rounded-2xl p-6 shadow-md border text-center space-y-4">
                    <GiatLogo className="w-16 h-16 mx-auto" />
                    <h2 className="text-xl font-extrabold">{t.adminTitle}</h2>
                    <input
                      type="password"
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value)}
                      placeholder={t.adminPinPlaceholder}
                      className="w-full px-4 py-3 rounded-xl border text-center font-bold tracking-widest"
                    />
                    {pinError && <div className="text-xs text-red-600 font-bold">{pinError}</div>}
                    <button
                      onClick={() => {
                        if (pinInput.trim() === (sbConfig.adminPin || "2350")) {
                          setAdminUnlocked(true);
                          setPinError("");
                        } else {
                          setPinError("PIN incorrect");
                        }
                      }}
                      className="w-full py-3 rounded-xl bg-[#002664] text-white font-extrabold text-sm"
                    >
                      {t.adminUnlock}
                    </button>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-slate-900 text-white rounded-2xl p-5 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <GiatLogo className="w-12 h-12" />
                        <h2 className="text-xl font-extrabold">{t.adminTitle}</h2>
                      </div>
                      <button
                        onClick={() => setShowSbModal(true)}
                        className="px-3.5 py-2 rounded-xl bg-[#FECB00] text-[#002664] text-xs font-extrabold"
                      >
                        ⚙️ {t.supabase}
                      </button>
                    </div>

                    <form onSubmit={handleAddModule} className="bg-white rounded-2xl p-6 border space-y-3 text-xs sm:text-sm">
                      <h3 className="font-extrabold text-base text-[#002664]">{t.addModTitle}</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block font-bold mb-1">{t.addModDay}</label>
                          <input
                            type="text"
                            value={newDayLabel}
                            onChange={(e) => setNewDayLabel(e.target.value)}
                            className="w-full px-3.5 py-2 rounded-xl border"
                          />
                        </div>
                        <div>
                          <label className="block font-bold mb-1">{t.addModNameFr}</label>
                          <input
                            type="text"
                            value={newModFr}
                            onChange={(e) => setNewModFr(e.target.value)}
                            className="w-full px-3.5 py-2 rounded-xl border"
                          />
                        </div>
                        <div>
                          <label className="block font-bold mb-1">{t.addModNameAr}</label>
                          <input
                            type="text"
                            value={newModAr}
                            onChange={(e) => setNewModAr(e.target.value)}
                            className="w-full px-3.5 py-2 rounded-xl border"
                          />
                        </div>
                        <div>
                          <label className="block font-bold mb-1">{t.addModNameEn}</label>
                          <input
                            type="text"
                            value={newModEn}
                            onChange={(e) => setNewModEn(e.target.value)}
                            className="w-full px-3.5 py-2 rounded-xl border"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="block font-bold mb-1">{t.addModContent}</label>
                        <textarea
                          rows="3"
                          value={newModContent}
                          onChange={(e) => setNewModContent(e.target.value)}
                          className="w-full px-3.5 py-2 rounded-xl border"
                        />
                      </div>
                      <button
                        type="submit"
                        className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm"
                      >
                        + {t.addModBtn}
                      </button>
                    </form>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Supabase Config Modal */}
          {showSbModal && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-3 text-xs">
                <div className="flex justify-between border-b pb-2">
                  <h3 className="font-extrabold text-sm">Supabase</h3>
                  <button onClick={() => setShowSbModal(false)}>✕</button>
                </div>
                <input
                  type="text"
                  value={sbConfig.url}
                  onChange={(e) => setSbConfig({ ...sbConfig, url: e.target.value })}
                  placeholder="https://xxxx.supabase.co"
                  className="w-full px-3 py-2 rounded-xl border"
                />
                <input
                  type="text"
                  value={sbConfig.anonKey}
                  onChange={(e) => setSbConfig({ ...sbConfig, anonKey: e.target.value })}
                  placeholder="Anon Key"
                  className="w-full px-3 py-2 rounded-xl border"
                />
                <input
                  type="text"
                  value={sbConfig.adminPin}
                  onChange={(e) => setSbConfig({ ...sbConfig, adminPin: e.target.value })}
                  placeholder="Admin PIN (2350)"
                  className="w-full px-3 py-2 rounded-xl border"
                />
                <button
                  onClick={() => {
                    if (supabaseClient) setSbConnected(true);
                    setShowSbModal(false);
                  }}
                  className="px-4 py-2 rounded-xl bg-[#002664] text-white font-extrabold"
                >
                  OK
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="no-print bg-slate-900 text-slate-400 text-xs py-6 px-4 mt-10">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <GiatLogo className="w-8 h-8" />
                <span>
                  <strong className="text-white">GIAT — Gombo Intelligence Artificielle Tchad</strong> • PDG Mahamat Gombo Abakar
                </span>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={() => setActiveTab("live")} className="text-amber-400 hover:underline font-bold">
                  📡 {t.navLive}
                </button>
                <span>•</span>
                <button onClick={() => setActiveTab("admin")} className="text-white hover:underline font-bold">
                  🔐 {t.adminBtn}
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
