    function compressImage(file, maxWidth = 520) {
      return new Promise((resolve) => {
        if (!file) return resolve("");
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

                              if (adminFilter === "kyc_pending") return c.kycStatus === "pending";
                              if (adminFilter === "pay_pending") return c.paymentStatus === "pending";
                              if (adminFilter === "certified") return Boolean(c.certNumber);
                              return true;
                            })
                            .map((c) => (
                              <tr key={c.id} className="hover:bg-slate-50">
                                <td className="p-3.5">
                                  <div className="font-extrabold text-slate-900">
                                    {c.fullName || "Sans nom"}
                                  </div>
                                  <div className="text-slate-500">
                                    {c.phone} • {c.email}
                                  </div>
                                </td>
                                <td className="p-3.5">
                                  <div className="font-bold">{c.city}</div>
                                  <div className="text-slate-500">
                                    {c.mode === "presential" ? "Présentiel 🏫" : "En ligne 💻"}
                                  </div>
                                </td>
                                <td className="p-3.5">
                                  <span
                                    className={`px-2 py-0.5 rounded-full font-bold ${
                                      c.kycStatus === "verified"
                                        ? "bg-emerald-100 text-emerald-800"
                                        : c.kycStatus === "rejected"
                                        ? "bg-red-100 text-red-800"
                                        : "bg-amber-100 text-amber-800"
                                    }`}
                                  >
                                    {c.kycStatus}
                                  </span>
                                </td>
                                <td className="p-3.5">
                                  <div className="font-bold">
                                    {c.paymentStatus === "paid" ? "Payé 5000F ✅" : c.paymentStatus}
                                  </div>
                                  <div className="text-slate-500 font-mono">
                                    {c.txId || "—"}
                                  </div>
                                </td>
                                <td className="p-3.5">
                                  <div className="flex flex-wrap gap-1.5">
                                    <button
                                      onClick={() => setInspectedCandidate(c)}
                                      className="px-2.5 py-1 rounded bg-slate-800 text-white font-bold"
                                    >
                                      Inspecter
                                    </button>
                                    {c.kycStatus !== "verified" && (
                                      <button
                                        onClick={() =>
                                          adminUpdateCandidate(c.id, { kycStatus: "verified" })
                                        }
                                        className="px-2.5 py-1 rounded bg-emerald-600 text-white font-bold"
                                      >
                                        Approuver KYC
                                      </button>
                                    )}
                                    {c.paymentStatus !== "paid" && (
                                      <button
                                        onClick={() =>
                                          adminUpdateCandidate(c.id, { paymentStatus: "paid" })
                                        }
                                        className="px-2.5 py-1 rounded bg-blue-600 text-white font-bold"
                                      >
                                        Valider 5000F
                                      </button>
                                    )}
                                  </div>
                                </td>
                              </tr>
                            ))}
                          {allCandidates.length === 0 && (
                            <tr>
                              <td colSpan="5" className="p-8 text-center text-slate-500">
                                Aucun dossier enregistré pour le moment. Les inscriptions KYC et paiements apparaîtront ici automatiquement.
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* ==================== INSPECT KYC MODAL ==================== */}
          {inspectedCandidate && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">
                    Inspection Dossier : {inspectedCandidate.fullName}
                  </h3>
                  <button
                    onClick={() => setInspectedCandidate(null)}
                    className="text-slate-500 font-bold text-sm"
                  >
                    ✕ Fermer
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                  <div>
                    <div className="font-bold text-slate-700 mb-1">
                      Pièce d'identité ({inspectedCandidate.idType}) :
                    </div>
                    {inspectedCandidate.idPhoto ? (
                      <img
                        src={inspectedCandidate.idPhoto}
                        alt="ID"
                        className="w-full h-48 object-contain border rounded-xl bg-slate-50"
                      />
                    ) : (
                      <div className="h-32 border rounded-xl flex items-center justify-center text-slate-400">
                        Aucune photo pièce jointe
                      </div>
                    )}
                  </div>
                  <div>
                    <div className="font-bold text-slate-700 mb-1">Selfie Liveness :</div>
                    {inspectedCandidate.selfiePhoto ? (
                      <img
                        src={inspectedCandidate.selfiePhoto}
                        alt="Selfie"
                        className="w-full h-48 object-contain border rounded-xl bg-slate-50"
                      />
                    ) : (
                      <div className="h-32 border rounded-xl flex items-center justify-center text-slate-400">
                        Aucun selfie joint
                      </div>
                    )}
                  </div>
                </div>

                <div className="p-3 rounded-xl bg-slate-50 text-xs space-y-1">
                  <div>
                    <strong>Téléphone :</strong> {inspectedCandidate.phone} |{" "}
                    <strong>Email :</strong> {inspectedCandidate.email}
                  </div>
                  <div>
                    <strong>Ville :</strong> {inspectedCandidate.city} ({inspectedCandidate.district})
                  </div>
                  <div>
                    <strong>Transaction Mobile Money :</strong> {inspectedCandidate.paymentMethod} —{" "}
                    <span className="font-mono font-bold">{inspectedCandidate.txId || "Non renseigné"}</span>
                  </div>
                </div>

                <div className="flex flex-wrap gap-2 pt-2">
                  <button
                    onClick={() =>
                      adminUpdateCandidate(inspectedCandidate.id, { kycStatus: "verified" })
                    }
                    className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold"
                  >
                    ✅ Approuver KYC
                  </button>
                  <button
                    onClick={() =>
                      adminUpdateCandidate(inspectedCandidate.id, { kycStatus: "rejected" })
                    }
                    className="px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-extrabold"
                  >
                    ❌ Rejeter KYC
                  </button>
                  <button
                    onClick={() =>
                      adminUpdateCandidate(inspectedCandidate.id, { paymentStatus: "paid" })
                    }
                    className="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-extrabold"
                  >
                    💰 Valider Paiement 5 000 FCFA
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ==================== SUPABASE CONFIG MODAL ==================== */}
          {showSbModal && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">
                    Configuration Base de Données Supabase
                  </h3>
                  <button
                    onClick={() => setShowSbModal(false)}
                    className="text-slate-500 font-bold text-sm"
                  >
                    ✕ Fermer
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">
                      1. Project URL Supabase
                    </label>
                    <input
                      type="text"
                      value={sbConfig.url}
                      onChange={(e) => setSbConfig({ ...sbConfig, url: e.target.value })}
                      placeholder="https://votre-projet.supabase.co"
                      className="w-full px-3 py-2 rounded-xl border border-slate-300"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">
                      2. Clé Publique (anon public key)
                    </label>
                    <input
                      type="text"
                      value={sbConfig.anonKey}
                      onChange={(e) => setSbConfig({ ...sbConfig, anonKey: e.target.value })}
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      className="w-full px-3 py-2 rounded-xl border border-slate-300"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">
                      3. Code PIN Admin PDG (défaut : 2350)
                    </label>
                    <input
                      type="text"
                      value={sbConfig.adminPin}
                      onChange={(e) => setSbConfig({ ...sbConfig, adminPin: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300"
                    />
                  </div>

                  {sbError && (
                    <div className="p-2.5 rounded-lg bg-red-50 text-red-700 font-bold">
                      Erreur : {sbError}
                    </div>
                  )}

                  <div className="flex gap-2">
                    <button
                      onClick={async () => {
                        await fetchAllFromSupabase(false);
                        setShowSbModal(false);
                      }}
                      className="px-4 py-2.5 rounded-xl bg-[#002664] text-white font-extrabold"
                    >
                      Enregistrer et Connecter
                    </button>
                    <button
                      onClick={() => {
                        navigator.clipboard?.writeText(SQL_SNIPPET);
                        notify("Script SQL copié ! Collez-le dans SQL Editor sur Supabase.");
                      }}
                      className="px-4 py-2.5 rounded-xl bg-amber-100 text-amber-900 font-extrabold"
                    >
                      Copier le Script SQL
                    </button>
                  </div>

                  <pre className="p-3 rounded-xl bg-slate-900 text-emerald-300 text-[11px] overflow-x-auto">
                    {SQL_SNIPPET}
                  </pre>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="no-print bg-slate-900 text-slate-400 text-xs py-6 px-4 mt-10">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div>
                <strong className="text-white">GIAT — Gombo Intelligence Artificielle Tchad</strong> • PDG Mahamat Gombo Abakar
              </div>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowSbModal(true)}
                  className="text-amber-400 hover:underline font-bold"
                >
                  Configuration Supabase
                </button>
                <span>•</span>
                <button
                  onClick={() => setActiveTab("admin")}
                  className="text-white hover:underline font-bold"
                >
                  🔐 Admin PDG
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
