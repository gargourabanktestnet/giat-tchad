    function compressImage(file, maxWidth = 520) {
      return new Promise((resolve) => {
        if (!file) return resolve("");
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

          return "🤖 GIAT Auto-Reply (KYC): Fill in your name, birth date & place, phone, email, province/diaspora, and format (Online 💻 or In-person), upload ID FRONT & BACK photos, and click Validate KYC Immediately.";

          return "🤖 GIAT Auto-Reply (5,000 FCFA Payment): After KYC, open 2. Pay 5000F, send 5,000 FCFA via Moov Money (+235 92 82 52 52) or Airtel Money (+235 66 78 75 46), enter your transaction ID, and confirm to unlock modules.";
        }
        return "🤖 Réponse Auto GIAT (Paiement 5 000 FCFA) : Après validation du KYC, allez dans « 2. Paiement 5000F », effectuez le paiement de 5 000 FCFA via Moov Money (+235 92 82 52 52) ou Airtel Money (+235 66 78 75 46), saisissez l'ID de transaction et confirmez pour débloquer les modules.";
      }

      if (q.includes("module") || q.includes("cours") || q.includes("jour") || q.includes("débloqu") || q.includes("coch") || q.includes("وحدة") || q.includes("دروس") || q.includes("unlock")) {
        if (lang === "ar") {
          return "🤖 رد آلي GIAT (الوحدات الـ 10): تأكد أولاً من إتمام KYC والدفع (5,000 FCFA). في تبويب «3. الدروس (10 أيام)»، اختر الوحدة، اقرأ أو استمع للدرس، أجب عن سؤال التحقق ثم اضغط «اعتماد وتحديد هذه الوحدة» ليظهر ✅ وتتحدث النسبة.";
        }
        if (lang === "en") {
          return "🤖 GIAT Auto-Reply (10 Modules): Ensure KYC and 5,000 FCFA payment are confirmed. In 3. Courses (10 Days), select a module, read or listen to the lesson, answer the check question, and click Validate & Check This Module.";
        }
        return "🤖 Réponse Auto GIAT (10 Modules) : Vérifiez que votre KYC et votre paiement (5 000 FCFA) sont validés. Dans « 3. Cours (10 Jours) », sélectionnez le module, lisez ou écoutez la leçon, répondez au quiz puis cliquez sur « Valider et cocher ce module » pour afficher ✅.";
      }

      if (q.includes("attestation") || q.includes("certificat") || q.includes("cachet") || q.includes("qr") || q.includes("شهادة") || q.includes("ختم") || q.includes("certificate")) {
        if (lang === "ar") {
          return "🤖 رد آلي GIAT (الشهادة والختم): يتم إنشاء رقم الشهادة وتفعيل الختم الرسمي ورمز QR تلقائياً بمجرد إتمام جميع الوحدات العشر (10 أيام على الأقل)، مع إظهار تاريخ ومكان الميلاد وطباعة PDF A4.";
        }
        if (lang === "en") {
          return "🤖 GIAT Auto-Reply (Certificate & Seal): Once all 10 modules (at least 10 days) are completed, your certificate number, official seal, and QR code unlock automatically with your birth date/place and A4 PDF print.";
        }
        return "🤖 Réponse Auto GIAT (Attestation & Cachet) : Dès que les 10 modules (au moins 10 jours) sont validés, votre numéro d'attestation, le cachet officiel et le QR Code s'activent automatiquement avec votre date et lieu de naissance, prêts pour l'impression A4.";
      }

      if (q.includes("présentiel") || q.includes("ligne") || q.includes("online") || q.includes("presential") || q.includes("حضوري") || q.includes("بُعد") || q.includes("province") || q.includes("diaspora")) {
        if (lang === "ar") {
          return "🤖 رد آلي GIAT (أنماط التكوين والتغطية): البرنامج متاح عن بُعد 💻 أو حضورياً لمدة لا تقل عن 10 أيام، ويخدم جميع الفئات في الولايات الـ 23 بتشاد والمهجر (التلاميذ، الطلاب والباحثون، التجار، التوظيف والمنظمات، رواد الأعمال وباقي الفئات).";
        }
        if (lang === "en") {
          return "🤖 GIAT Auto-Reply (Formats & Reach): Training runs for at least 10 days Online 💻 or In-person, serving all audiences across Chad's 23 provinces and the diaspora (school students, university students & researchers, merchants, jobs/NGOs, entrepreneurs, and other publics).";
        }
        return "🤖 Réponse Auto GIAT (Modalités & Couverture) : La formation dure au moins 10 jours en ligne 💻 ou en présentiel, et s'adresse à tous les publics des 23 provinces du Tchad et de la diaspora (élèves, étudiants et chercheurs, commerçant(e)s, emploi/ONG/bureau, entrepreneurs et autres publics).";
      }

      if (lang === "ar") {
        return "🤖 رد آلي GIAT: تم استلام رسالتك («" + rawText + "»). يمكنك تحديد موضوع مشكلتك (KYC، الدفع 5000F، الوحدات الـ 10، الشهادة، أو التكوين عن بُعد 💻 / حضوري) للحصول على إرشاد فوري خطوة بخطوة.";
      }
      if (lang === "en") {
        return "🤖 GIAT Auto-Reply: We received your message (\"" + rawText + "\"). Mention your topic (KYC, 5000F payment, 10 modules, certificate, or Online 💻 / In-person) for instant step-by-step guidance.";
      }
      return "🤖 Réponse Auto GIAT : Votre message (« " + rawText + " ») est bien pris en compte. Précisez votre souci (KYC, paiement 5000F, 10 modules, attestation, ou formation en ligne 💻 / en présentiel) pour une aide immédiate étape par étape.";
    }

    function App() {
      const [lang, setLang] = useState("fr");
      const t = I18N[lang] || I18N.fr;
      const isRtl = lang === "ar";

      const [activeTab, setActiveTab] = useState("home");

      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem("giat_user_v7");
          return saved ? { ...DEFAULT_USER, ...JSON.parse(saved) } : DEFAULT_USER;
        } catch {
          return DEFAULT_USER;
        }
      });

      const [allCandidates, setAllCandidates] = useState(() => {
        try {
          const saved = localStorage.getItem("giat_all_candidates_v7");
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [customModules, setCustomModules] = useState(() => {
        try {
          const saved = localStorage.getItem("giat_custom_modules_v2");
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [liveFeed, setLiveFeed] = useState(() => {
        try {
          const saved = localStorage.getItem("giat_live_feed_v2");
          return saved
            ? JSON.parse(saved)
            : [
                {
                  id: "LIVE-1",
                  author: "GIAT Tchad",
                  region: "N'Djamena",
                  type: "system",
                  text: "Bienvenue sur le Canal Temps Réel GIAT ! Formation d'au moins 10 jours en ligne 💻 ou en présentiel • 23 Provinces & Diaspora • Réponse automatique active.",
                  time: "En direct"
                }
              ];
        } catch {
          return [];
        }
      });
      const [liveInput, setLiveInput] = useState("");

      const [notifications, setNotifications] = useState([
        {
          id: "N-1",
          text: "Plateforme GIAT opérationnelle : programme d'au moins 10 jours disponible en ligne 💻 ou en présentiel pour tous les publics des 23 provinces du Tchad et de la diaspora.",
          time: "Maintenant",
          read: false,
          tab: "courses"
        }
      ]);
      const [notifOpen, setNotifOpen] = useState(false);

      const [voiceState, setVoiceState] = useState("idle");
      const [selectedModule, setSelectedModule] = useState(1);
      const [quizChoice, setQuizChoice] = useState(null);

      // Admin module builder form
      const [newDayLabel, setNewDayLabel] = useState("Jour 11 / Day 11");
      const [newModFr, setNewModFr] = useState("");
      const [newModAr, setNewModAr] = useState("");
      const [newModEn, setNewModEn] = useState("");
      const [newModContent, setNewModContent] = useState("");

      const [sbConfig, setSbConfig] = useState(() => {
        try {
          const saved = localStorage.getItem("giat_supabase_cfg");
          return saved ? JSON.parse(saved) : { url: "", anonKey: "", adminPin: "2350" };
        } catch {
          return { url: "", anonKey: "", adminPin: "2350" };
        }
      });
      const [sbConnected, setSbConnected] = useState(false);
      const [showSbModal, setShowSbModal] = useState(false);

      const [adminUnlocked, setAdminUnlocked] = useState(false);
      const [pinInput, setPinInput] = useState("");
      const [pinError, setPinError] = useState("");

      const [dirSearch, setDirSearch] = useState("");
      const [verifyCode, setVerifyCode] = useState("");
      const [verifyResult, setVerifyResult] = useState(null);
      const [toast, setToast] = useState("");

      const allModules = useMemo(
        () => [...BASE_10_DAY_MODULES, ...customModules],
        [customModules]
      );

      const unreadCount = useMemo(
        () => notifications.filter((n) => !n.read).length,
        [notifications]
      );

      const addLiveEvent = (author, region, text, type = "member") => {
        const entry = {
          id: `LIVE-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          author: author || "Membre GIAT",
          region: region || user.region || "Tchad",
          type,
          text,
          time: new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
        };
        setLiveFeed((prev) => [entry, ...prev.slice(0, 59)]);
        return entry;
      };

      const notify = (msg, targetTab = null, pushToLive = false) => {
        setToast(msg);
        setTimeout(() => setToast(""), 4200);
        const timeStr = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
        setNotifications((prev) => [
          { id: `N-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`, text: msg, time: timeStr, read: false, tab: targetTab },
          ...prev.slice(0, 39)
        ]);
        if (pushToLive) {
          addLiveEvent(user.fullName || "Apprenant GIAT", user.region, msg, "activity");
        }
      };

      const supabaseClient = useMemo(() => {
        if (!sbConfig.url || !sbConfig.anonKey || !window.supabase) return null;
        try {
          return window.supabase.createClient(sbConfig.url.trim(), sbConfig.anonKey.trim());
        } catch {
          return null;
        }
      }, [sbConfig.url, sbConfig.anonKey]);

      useEffect(() => {
        localStorage.setItem("giat_user_v7", JSON.stringify(user));
      }, [user]);

      useEffect(() => {
        localStorage.setItem("giat_all_candidates_v7", JSON.stringify(allCandidates));
      }, [allCandidates]);

      useEffect(() => {
        localStorage.setItem("giat_custom_modules_v2", JSON.stringify(customModules));
      }, [customModules]);

      useEffect(() => {
        localStorage.setItem("giat_live_feed_v2", JSON.stringify(liveFeed));
      }, [liveFeed]);

      useEffect(() => {
        localStorage.setItem("giat_supabase_cfg", JSON.stringify(sbConfig));
      }, [sbConfig]);

      useEffect(() => {
        if (!supabaseClient) {
          setSbConnected(false);
          return;
        }
        setSbConnected(true);
        const channel = supabaseClient
          .channel("giat-realtime-channel")
          .on("broadcast", { event: "live-post" }, (payload) => {
            if (payload?.payload) {
              setLiveFeed((prev) => {
                if (prev.some((item) => item.id === payload.payload.id)) return prev;
                return [payload.payload, ...prev.slice(0, 59)];
              });
            }
          })
          .subscribe();

        return () => {
          supabaseClient.removeChannel(channel);
        };
      }, [supabaseClient]);

      const handleSendLiveMessage = async (e) => {
        e.preventDefault();
        const trimmed = liveInput.trim();
        if (!trimmed) return;

        const userEntry = addLiveEvent(
          user.fullName || "Apprenant GIAT",
          user.region || "Tchad",
          trimmed,
          "chat"
        );
        setLiveInput("");

        const botReplyText = generateAutomatedSupportReply(trimmed, lang);
        const botEntry = {
          id: `LIVE-BOT-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          author: "Assistant Automatisé GIAT",
          region: "Support 24/7",
          type: "auto-reply",
          text: botReplyText,
          time: new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
        };
        setLiveFeed((prev) => [botEntry, ...prev.slice(0, 59)]);

        if (supabaseClient) {
          try {
            await supabaseClient.channel("giat-realtime-channel").send({
              type: "broadcast",
              event: "live-post",
              payload: userEntry
            });
            await supabaseClient.channel("giat-realtime-channel").send({
              type: "broadcast",
              event: "live-post",
              payload: botEntry
            });
          } catch (err) {
            console.error(err);
          }
        }
      };

      const stopAudio = () => {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        setVoiceState("idle");
      };

      useEffect(() => {
        stopAudio();
      }, [activeTab, selectedModule, lang]);

      const toggleAudio = (textToSpeak) => {
        if (!window.speechSynthesis) return;
        if (voiceState === "playing") {
          window.speechSynthesis.pause();
          setVoiceState("paused");
          return;
        }
        if (voiceState === "paused") {
          window.speechSynthesis.resume();
          setVoiceState("playing");
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(textToSpeak);
        utter.lang = lang === "ar" ? "ar-SA" : lang === "en" ? "en-US" : "fr-FR";
        utter.onend = () => setVoiceState("idle");
        utter.onerror = () => setVoiceState("idle");
        setVoiceState("playing");
        window.speechSynthesis.speak(utter);
      };

      const persistCandidate = async (nextUser) => {
        const cleanPhone = (nextUser.phone || "").replace(/\s+/g, "");
        const id = nextUser.id || (cleanPhone ? `CAND-${cleanPhone}` : `CAND-${Date.now()}`);
        const payload = { ...nextUser, id, updatedAt: new Date().toISOString() };
        setUser(payload);
        setAllCandidates((prev) => {
          const exists = prev.some((c) => c.id === id);
          return exists ? prev.map((c) => (c.id === id ? payload : c)) : [payload, ...prev];
        });
        if (supabaseClient) {
          try {
            await supabaseClient.from("giat_candidates").upsert({
              id,
              data: payload,
              updated_at: new Date().toISOString()
            });
          } catch (err) {
            console.error(err);
          }
        }
        return payload;
      };

      // Validation KYC fonctionnelle et fluide
      const handleKycSubmit = async (e) => {
        e.preventDefault();
        if (!user.fullName.trim() || !user.birthDate || !user.birthPlace.trim() || !user.phone.trim() || !user.email.trim()) {
          notify("Veuillez remplir tous les champs obligatoires (nom, date et lieu de naissance, téléphone, email).");
          return;
        }
        if (!user.idPhotoFront || !user.idPhotoBack) {
          notify("Veuillez charger les deux faces (RECTO et VERSO) de votre pièce d'identité.");
          return;
        }
        const modeLabel = user.mode === "presential" ? t.modePresential : t.modeOnline;
        await persistCandidate({ ...user, kycStatus: "verified" });
        notify(
          `KYC validé pour ${user.fullName} (${user.region} • ${modeLabel}). Passez au paiement de 5 000 FCFA.`,
          "payment",
          true
        );
        setActiveTab("payment");
      };

      // Confirmation du paiement 5 000 FCFA fonctionnelle et fluide
      const handlePaymentSubmit = async (e) => {
        e.preventDefault();
        if (!user.txId.trim()) {
          notify("Veuillez saisir l'identifiant / référence de transaction du paiement de 5 000 FCFA.");
          return;
        }
        const nextUser = {
          ...user,
          kycStatus: user.kycStatus === "none" ? "verified" : user.kycStatus,
          paymentStatus: "paid"
        };
        await persistCandidate(nextUser);
        notify(
          `Paiement de 5 000 FCFA confirmé (Réf: ${user.txId.trim()}) pour ${user.fullName || "Apprenant"}. Les 10 modules sont débloqués !`,
          "courses",
          true
        );
        setActiveTab("courses");
      };

      const isKycOk = user.kycStatus === "verified";
      const isPaidOk = user.paymentStatus === "paid";

      // Validation & cochage des 10 modules + modules ajoutés par l'Admin
      const handleValidateModule = async (modId) => {
        if (!isKycOk || !isPaidOk) {
          notify("Veuillez d'abord valider votre KYC et confirmer le paiement de 5 000 FCFA.");
          return;
        }
        const mod = allModules.find((m) => m.id === modId);
        if (!mod) return;
        const qObj = mod.quiz[lang] || mod.quiz.fr;
        const chosen = quizChoice !== null ? quizChoice : qObj.ans;
        if (chosen !== qObj.ans) {
          notify("Sélectionnez la bonne réponse à la question de validation du module.");
          return;
        }

        const completedSet = new Set(user.completedModules || []);
        completedSet.add(modId);
        const completedArr = Array.from(completedSet);

        const allBaseDone = BASE_10_DAY_MODULES.every((m) => completedSet.has(m.id));
        let certNumber = user.certNumber;
        let certifiedAt = user.certifiedAt;

        if (allBaseDone && !certNumber) {
          const code = (user.region || "TCD")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .slice(0, 3)
            .toUpperCase();
          const rand = String(Math.floor(1000 + Math.random() * 9000));
          certNumber = `GIAT-2026-${code}-${rand}`;
          certifiedAt = new Date().toLocaleDateString("fr-FR");
        }

        await persistCandidate({
          ...user,
          completedModules: completedArr,
          certNumber,
          certifiedAt
        });

        setQuizChoice(null);
        notify(
          `Module #${modId} validé et coché (${completedArr.length}/${allModules.length} modules complétés).${
            allBaseDone ? ` Attestation ${certNumber} débloquée !` : ""
          }`,
          allBaseDone ? "cert" : "courses",
          true
        );

        if (allBaseDone && certNumber && !user.certNumber) {
          setActiveTab("cert");
        } else {
          const nextIdx = allModules.findIndex((m) => m.id === modId) + 1;
          if (nextIdx < allModules.length) {
            setSelectedModule(allModules[nextIdx].id);
          }
        }
      };

      const handleAddModule = (e) => {
        e.preventDefault();
        const titleFr = (newModFr || newModEn || newModAr).trim();
        const titleAr = (newModAr || titleFr).trim();
        const titleEn = (newModEn || titleFr).trim();
        const content = newModContent.trim();
        if (!titleFr || !content) {
          notify("Renseignez au moins un titre et le contenu du module.");
          return;
        }

        const maxId = allModules.reduce((acc, m) => Math.max(acc, m.id), 0);
        const created = {
          id: maxId + 1,
          day: newDayLabel.trim() || `Jour ${maxId + 1}`,
          duration: "1j",
          title: { fr: titleFr, ar: titleAr, en: titleEn },
          lesson: { fr: content, ar: content, en: content },
          quiz: {
            fr: {
              q: `Validez-vous la maîtrise du module : « ${titleFr} » ?`,
              opts: ["Oui, module maîtrisé", "Pas encore"],
              ans: 0
            },
            ar: {
              q: `هل تؤكد استيعاب وحدة: « ${titleAr} »؟`,
              opts: ["نعم، تم الاستيعاب", "ليس بعد"],
              ans: 0
            },
            en: {
              q: `Do you confirm completion of module: "${titleEn}"?`,
              opts: ["Yes, completed", "Not yet"],
              ans: 0
            }
          }
        };

        setCustomModules((prev) => [...prev, created]);
        setNewModFr("");
        setNewModAr("");
        setNewModEn("");
        setNewModContent("");
        setSelectedModule(created.id);
        setQuizChoice(0);
        notify(`Module #${created.id} (« ${titleFr} ») ajouté et prêt à être validé dans la liste des modules.`, "courses", true);
        setActiveTab("courses");
      };

      const progressPct = Math.round(((user.completedModules?.length || 0) / allModules.length) * 100);

      const audienceLabel = useMemo(() => {
        const list = TARGET_AUDIENCES[lang] || TARGET_AUDIENCES.fr;
        return list.find((a) => a.id === user.audience)?.label || list[0].label;
      }, [lang, user.audience]);

      const modeLabel = user.mode === "presential" ? t.modePresential : t.modeOnline;

      const combinedLaureates = useMemo(() => {
        const fromCandidates = allCandidates
          .filter((c) => c.certNumber)
          .map((c) => ({
            id: c.certNumber,
            fullName: c.fullName,
            region: c.region,
            audience: c.audience,
            mode: c.mode,
            certNumber: c.certNumber
          }));
        return [...fromCandidates, ...SAMPLE_LAUREATES];
      }, [allCandidates]);

      const filteredLaureates = combinedLaureates.filter(
        (l) =>
          l.fullName.toLowerCase().includes(dirSearch.toLowerCase()) ||
          l.region.toLowerCase().includes(dirSearch.toLowerCase()) ||
          l.id.toLowerCase().includes(dirSearch.toLowerCase())
      );

      const handleVerifyCert = () => {
        const code = verifyCode.trim().toUpperCase();
        if (!code) return;
        const found = combinedLaureates.find((l) => l.id.toUpperCase() === code);
        setVerifyResult(found || "invalid");
      };

      return (
        <div dir={isRtl ? "rtl" : "ltr"} className="min-h-screen flex flex-col">
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-amber-400/50 text-xs sm:text-sm font-medium max-w-md">
              {toast}
            </div>
          )}

          {/* Header */}
          <header className="no-print sticky top-0 z-40 bg-[#002664] text-white shadow-lg border-b-2 border-[#FECB00]">
            <div className="max-w-7xl mx-auto px-3 py-2.5 flex flex-wrap items-center justify-between gap-2">
              <div onClick={() => setActiveTab("home")} className="flex items-center gap-2.5 cursor-pointer">
                <GiatLogo className="w-11 h-11 shrink-0" />
                <div>
                  <div className="font-extrabold text-sm sm:text-base leading-tight">
                    {t.brandTitle}
                  </div>
                  <div className="text-[11px] text-amber-300 font-medium">
                    {t.brandSub}
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-1.5 sm:gap-2 relative">
                {/* Language Switcher */}
                <div className="flex rounded-lg bg-[#001b47] p-0.5 border border-white/20 text-[11px] font-extrabold">
                  {[
                    { code: "fr", label: "FR" },
                    { code: "ar", label: "عربي" },
                    { code: "en", label: "EN" }
                  ].map((item) => (
                    <button
                      key={item.code}
                      onClick={() => setLang(item.code)}
                      className={`px-2 py-1 rounded-md transition ${
                        lang === item.code ? "bg-[#FECB00] text-[#002664]" : "text-slate-200 hover:text-white"
                      }`}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>

                {/* Notifications Bell — Contenu complet affiché */}
                <div className="relative">
                  <button
                    onClick={() => setNotifOpen((p) => !p)}
                    className="relative px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/25 text-sm font-bold"
                  >
                    <span>🔔</span>
                    {unreadCount > 0 && (
                      <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-[#C60C30] text-white text-[10px] font-extrabold flex items-center justify-center">
                        {unreadCount}
                      </span>
                    )}
                  </button>
                  {notifOpen && (
                    <div className="absolute end-0 mt-2 w-96 max-w-[92vw] bg-white text-slate-900 rounded-2xl shadow-2xl border p-4 z-50 space-y-3 text-xs">
                      <div className="flex items-center justify-between border-b pb-2">
                        <span className="font-extrabold text-[#002664]">{t.notifTitle} ({unreadCount})</span>

                          >
                            {locked ? t.unlockFirst : `${t.validateMod} →`}
                          </button>
                        </div>
                      </div>
                    );
                  })()}
                </div>
              </div>
            )}

            {/* ==================== PROFESSIONAL CARD ==================== */}
            {activeTab === "card" && (
              <div className="max-w-md mx-auto">
                <div className="rounded-2xl overflow-hidden shadow-2xl border-2 border-[#FECB00] bg-gradient-to-br from-[#002664] via-[#001b47] to-slate-950 text-white p-6 space-y-4">
                  <div className="flex items-center gap-2.5 border-b border-white/15 pb-3">
                    <GiatLogo className="w-10 h-10" />
                    <div>
                      <div className="text-xs font-extrabold text-[#FECB00]">{t.cardHeader}</div>
                      <div className="font-extrabold text-sm">GIAT • {modeLabel}</div>
                    </div>
                  </div>

                  <div className="flex items-center gap-4">
                    <div className="w-20 h-20 rounded-xl bg-white/10 border border-amber-300/50 overflow-hidden flex items-center justify-center shrink-0">
                      {user.selfiePhoto ? (
                        <img src={user.selfiePhoto} alt="Photo" className="w-full h-full object-cover" />
                      ) : (
                        <span className="text-2xl">👤</span>
                      )}
                    </div>
                    <div className="space-y-1 text-xs">
                      <div className="font-extrabold text-base">{user.fullName || "Apprenant GIAT"}</div>
                      <div className="text-amber-200">
                        {t.bornLabel} : <strong>{user.birthDate || "—"}</strong> {t.atLabel}{" "}
                        <strong>{user.birthPlace || "—"}</strong>
                      </div>
                      <div className="text-slate-300">
                        {t.regionLabel} : <strong>{user.region}</strong> • {audienceLabel}
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-white/15 flex items-center justify-between text-[11px] text-slate-300">
                    <span>ID : {user.certNumber || user.id || "GIAT-2026"}</span>
                    <span>PDG Mahamat Gombo Abakar</span>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== CERTIFICATE A4 ==================== */}
            {activeTab === "cert" && (
              <div className="space-y-4">
                <div className="no-print flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border">
                  <div>
                    <h2 className="font-extrabold">{t.certHeader}</h2>
                    <p className="text-xs text-slate-500">
                      {user.certNumber || "Validez les 10 modules pour générer l'attestation"}
                    </p>
                  </div>
                  <button
                    onClick={() => window.print()}
                    disabled={!user.certNumber}
                    className="px-5 py-2.5 rounded-xl bg-[#002664] disabled:bg-slate-300 text-white font-extrabold text-xs"
                  >
                    🖨️ {t.printBtn}
                  </button>
                </div>

                <div
                  id="printable-certificate"
                  className="bg-white rounded-2xl p-6 sm:p-10 shadow-xl border-8 border-double border-[#002664] max-w-4xl mx-auto text-center space-y-6"
                >
                  <div className="flex flex-wrap items-center justify-between gap-2 text-xs font-extrabold text-[#002664] border-b-2 border-[#FECB00] pb-3">
                    <span>{t.certCountry}</span>
                    <div className="flex items-center gap-2">
                      <GiatLogo className="w-10 h-10" />
                      <span>GIAT TCHAD • {modeLabel}</span>
                    </div>
                    <span>{user.region}</span>
                  </div>

                  <div>
                    <div className="text-xs uppercase tracking-[0.2em] text-amber-700 font-extrabold">
                      {t.certAcademy}
                    </div>
                    <h1 className="font-serif-cert text-2xl sm:text-4xl font-extrabold text-[#002664] mt-1">
                      {t.certTitle}
                    </h1>
                  </div>

                  <p className="text-xs sm:text-sm text-slate-700 max-w-3xl mx-auto leading-relaxed">
                    {t.certBodyPrefix}{" "}
                    <strong className="font-serif-cert text-xl sm:text-2xl text-slate-900 underline decoration-[#FECB00]">
                      {user.fullName || "[NOM COMPLET]"}
                    </strong>
                    , {t.certBodyMid} <strong>{user.birthDate || "[DATE DE NAISSANCE]"}</strong>{" "}
                    {t.certBodyPlace} <strong>{user.birthPlace || "[LIEU DE NAISSANCE]"}</strong>,{" "}
                    {t.certBodyEnd}
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 items-center pt-5 border-t text-xs">
                    <div className="text-start space-y-1">
                      <div className="font-bold text-slate-500">{t.certNo} :</div>
                      <div className="font-extrabold text-[#002664] text-sm">
                        {user.certNumber || "GIAT-2026-EN-ATTENTE"}
                      </div>
                      <div className="text-slate-500">{user.certifiedAt || "—"}</div>
                    </div>

                    <div className="flex flex-col items-center">
                      <img
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(
                          user.certNumber || "GIAT-TCHAD-OFFICIEL"
                        )}`}
                        alt="QR Code"
                        className="w-24 h-24 border p-1 rounded-lg"
                      />
                    </div>

                    <div className="flex flex-col items-center justify-center min-h-[112px]">
                      {user.certNumber ? (
                        <img
                          src="./cachet-giat.png"
                          alt="Cachet Officiel GIAT"
                          onError={(e) => {
                            e.currentTarget.onerror = null;
                            e.currentTarget.src = FALLBACK_LOGO_SVG;
                          }}
                          className="w-28 h-28 object-contain -rotate-6 opacity-95"
                        />
                      ) : (
                        <div className="px-3 py-2 rounded-xl border border-dashed text-[11px] text-slate-400">
                          Cachet débloqué à la fin des modules
                        </div>
                      )}
                    </div>

                    <div className="text-end space-y-1">
                      <div className="font-bold text-slate-700">{t.ceoTitle}</div>
                      <div className="font-serif-cert italic text-base font-bold text-[#002664]">
                        Mahamat Gombo Abakar
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== DIRECTORY & QR ==================== */}
            {activeTab === "directory" && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 shadow-sm border space-y-3">
                  <h2 className="text-lg font-extrabold">🔍 QR / Certificat</h2>
                  <div className="flex flex-wrap gap-2">
                    <input
                      type="text"
                      value={verifyCode}
                      onChange={(e) => setVerifyCode(e.target.value)}
                      placeholder="GIAT-2026-NDJ-0001"
                      className="px-3.5 py-2.5 rounded-xl border text-sm flex-1 min-w-[220px]"
                    />
                    <button
                      onClick={handleVerifyCert}
                      className="px-5 py-2.5 rounded-xl bg-[#002664] text-white font-bold text-sm"
                    >
                      OK
                    </button>
                  </div>
                  {verifyResult && (
                    <div className="p-3.5 rounded-xl bg-emerald-50 border border-emerald-300 text-xs font-bold">
                      {verifyResult === "invalid"
                        ? "❌ Introuvable"
                        : `✅ ${verifyResult.fullName} (${verifyResult.region}) — ${verifyResult.id}`}
                    </div>
                  )}
                </div>

                <div className="bg-white rounded-2xl p-6 shadow-sm border space-y-4">
                  <div className="flex flex-wrap justify-between gap-2">
                    <h2 className="text-lg font-extrabold">🇹🇩 {t.navDir}</h2>
                    <input
                      type="text"
                      value={dirSearch}
                      onChange={(e) => setDirSearch(e.target.value)}
                      placeholder="Province / Diaspora / Nom..."
                      className="px-3.5 py-2 rounded-xl border text-xs"
                    />
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {filteredLaureates.map((l) => (
                      <div key={l.id} className="p-4 rounded-xl border flex items-center justify-between">
                        <div>
                          <div className="font-extrabold text-sm">{l.fullName}</div>
                          <div className="text-xs text-slate-600">
                            {l.region} • {l.audience} • {l.mode === "presential" ? t.modePresential : t.modeOnline}
                          </div>
                          <div className="text-[11px] text-slate-400">{l.id}</div>
                        </div>
                        <span className="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[11px] font-extrabold">
                          GIAT ✅
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ==================== ADMIN & MODULE BUILDER ==================== */}
            {activeTab === "admin" && (
              <div className="space-y-6">
                {!adminUnlocked ? (
                  <div className="max-w-md mx-auto bg-white rounded-2xl p-6 shadow-md border text-center space-y-4">
                    <GiatLogo className="w-16 h-16 mx-auto" />
                    <h2 className="text-xl font-extrabold">{t.adminTitle}</h2>
                    <input
                      type="password"
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value)}
                      placeholder={t.adminPinPlaceholder}
                      className="w-full px-4 py-3 rounded-xl border text-center font-bold tracking-widest"
                    />
                    {pinError && <div className="text-xs text-red-600 font-bold">{pinError}</div>}
                    <button
                      onClick={() => {
                        if (pinInput.trim() === (sbConfig.adminPin || "2350")) {
                          setAdminUnlocked(true);
                          setPinError("");
                        } else {
                          setPinError("PIN incorrect");
                        }
                      }}
                      className="w-full py-3 rounded-xl bg-[#002664] text-white font-extrabold text-sm"
                    >
                      {t.adminUnlock}
                    </button>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-slate-900 text-white rounded-2xl p-5 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <GiatLogo className="w-12 h-12" />
                        <h2 className="text-xl font-extrabold">{t.adminTitle}</h2>
                      </div>
                      <button
                        onClick={() => setShowSbModal(true)}
                        className="px-3.5 py-2 rounded-xl bg-[#FECB00] text-[#002664] text-xs font-extrabold"
                      >
                        ⚙️ {t.supabase}
                      </button>
                    </div>

                    <form onSubmit={handleAddModule} className="bg-white rounded-2xl p-6 border space-y-3 text-xs sm:text-sm">
                      <h3 className="font-extrabold text-base text-[#002664]">{t.addModTitle}</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block font-bold mb-1">{t.addModDay}</label>
                          <input
                            type="text"
                            value={newDayLabel}
                            onChange={(e) => setNewDayLabel(e.target.value)}
                            className="w-full px-3.5 py-2 rounded-xl border"
                          />
                        </div>
                        <div>
                          <label className="block font-bold mb-1">{t.addModNameFr}</label>
                          <input
                            type="text"
                            value={newModFr}
                            onChange={(e) => setNewModFr(e.target.value)}
                            className="w-full px-3.5 py-2 rounded-xl border"
                          />
                        </div>
                        <div>
                          <label className="block font-bold mb-1">{t.addModNameAr}</label>
                          <input
                            type="text"
                            value={newModAr}
                            onChange={(e) => setNewModAr(e.target.value)}
                            className="w-full px-3.5 py-2 rounded-xl border"
                          />
                        </div>
                        <div>
                          <label className="block font-bold mb-1">{t.addModNameEn}</label>
                          <input
                            type="text"
                            value={newModEn}
                            onChange={(e) => setNewModEn(e.target.value)}
                            className="w-full px-3.5 py-2 rounded-xl border"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="block font-bold mb-1">{t.addModContent}</label>
                        <textarea
                          rows="3"
                          value={newModContent}
                          onChange={(e) => setNewModContent(e.target.value)}
                          className="w-full px-3.5 py-2 rounded-xl border"
                        />
                      </div>
                      <button
                        type="submit"
                        className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm"
                      >
                        + {t.addModBtn}
                      </button>
                    </form>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Supabase Config Modal */}
          {showSbModal && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-3 text-xs">
                <div className="flex justify-between border-b pb-2">
                  <h3 className="font-extrabold text-sm">Supabase</h3>
                  <button onClick={() => setShowSbModal(false)}>✕</button>
                </div>
                <input
                  type="text"
                  value={sbConfig.url}
                  onChange={(e) => setSbConfig({ ...sbConfig, url: e.target.value })}
                  placeholder="https://xxxx.supabase.co"
                  className="w-full px-3 py-2 rounded-xl border"
                />
                <input
                  type="text"
                  value={sbConfig.anonKey}
                  onChange={(e) => setSbConfig({ ...sbConfig, anonKey: e.target.value })}
                  placeholder="Anon Key"
                  className="w-full px-3 py-2 rounded-xl border"
                />
                <input
                  type="text"
                  value={sbConfig.adminPin}
                  onChange={(e) => setSbConfig({ ...sbConfig, adminPin: e.target.value })}
                  placeholder="Admin PIN (2350)"
                  className="w-full px-3 py-2 rounded-xl border"
                />
                <button
                  onClick={() => {
                    if (supabaseClient) setSbConnected(true);
                    setShowSbModal(false);
                  }}
                  className="px-4 py-2 rounded-xl bg-[#002664] text-white font-extrabold"
                >
                  OK
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="no-print bg-slate-900 text-slate-400 text-xs py-6 px-4 mt-10">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <GiatLogo className="w-8 h-8" />
                <span>
                  <strong className="text-white">GIAT — Gombo Intelligence Artificielle Tchad</strong> • {modeLabel} • PDG Mahamat Gombo Abakar
                </span>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={() => setActiveTab("live")} className="text-amber-400 hover:underline font-bold">
                  📡 {t.navLive}
                </button>
                <span>•</span>
                <button onClick={() => setActiveTab("admin")} className="text-white hover:underline font-bold">
                  🔐 {t.adminBtn}
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
